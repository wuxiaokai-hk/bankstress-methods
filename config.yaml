# Public-methods benchmark: forecast bank balances, rates and net interest income under macro scenarios
# with methods published by the IMF, the Federal Reserve and the New York Fed, and compare them out-of-sample.
#
# Paths are relative to this file.

output_dir: outputs

macro:
  metadata: data/macro_metadata.csv          # mnemonic, description, geography, theme, transform (dlog/diff), expected_sign
  scenarios:                                  # history + scenario path in each file; history must be identical
    baseline: data/scenario_baseline.csv
    upside: data/scenario_s1_upside.csv
    downside: data/scenario_s3_downside.csv
    severe: data/scenario_s4_severe.csv
  date_column: date

# Which macro series may enter a model: signed series (expected_sign = +1/-1 in the target's sign file)
# in these geographies. The sign file of each target decides the sign.
candidates:
  geographies: [Canada, Ontario]
  exclude_themes: [Other]
  max_lag: 2                  # each driver enters at one lag, 0..max_lag, chosen when screening
  n_screen: 10                # keep the 10 best-correlated, correctly signed drivers at each origin
  max_per_theme: 2            # at most 2 drivers from the same theme

# ---- How drivers may enter the equations. Put any of these under a target to apply them to that target only.
restrictions:
  signs: true                 # false: no sign restrictions at all (every driver gets a free sign)
  apply_to: [bma]             # which methods impose the expected signs: bma, combination, class
                              #   bma          equations with a wrong-signed long-run effect are dropped
                              #   combination  equations whose summed lag coefficients have the wrong sign are dropped
                              #   class        a wrong sign is flagged in the report (the equation is fixed)
  free_sign: []               # drivers kept as candidates but with no sign restriction, e.g. [FRTB3M.IC]
  include_unsigned: false     # true: series without an expected sign may also enter (with a free sign)
  exclude: []                 # never used, e.g. [FHPI.IC]
  force_in: []                # in every BMA equation (and every combination equation): VAR or VAR@lag,
                              #   e.g. [FHPI.ION@1]. If the data give it the wrong sign in every equation,
                              #   its sign check is dropped and the report says so.
  not_together: []            # groups of which an equation holds at most one, e.g. [[FYPD.ION, FYPD.IC]]
  max_corr: 0.85              # two screened drivers more correlated than this are not both kept; null = no limit

# ---- Accounting identities between targets (forecasts made to add up).
# An identity is imposed only when every target in it is forecast in the run (enforce: auto), so a run of one or
# two targets ignores it. identities_on: false (or --identities off) ignores them all.
identities_on: true
identities:
  - name: Loans add up
    equation: total_loans = mortgage_balance + commercial_balance    # linear: name, number*name, + and -
    method: reconcile         # reconcile: every target moves, the least certain forecasts the most
                              # residual: one target takes the whole gap (set residual: total_loans)
    weights: errors           # reconcile weights: errors (out-of-sample error variance), size, or equal
    enforce: auto             # auto | true (stop if a target is missing) | false (ignore this one)
  # - name: Funding
  #   equation: total_loans = deposit_balance + wholesale_funding + equity - liquid_assets
  #   method: residual
  #   residual: wholesale_funding

# ---- Panel or bank by bank. Put this under a target to set it for that target only.
estimation:
  mode: panel                 # panel: banks pooled with bank fixed effects
                              # separate: every bank estimated on its own (its own drivers, BMA, report section)
  banks: all                  # all, or a list of names, e.g. [Bank A, Bank C]

# ---- How methods are ranked, and against what.
ranking:
  metric: mean                # mean      average error (for balances: % of the level, a MAPE)
                              # rmse      root mean squared error: large deviations weigh more
                              # p90       the error exceeded in 10% of cases
                              # cvar      average of the worst tail_share of errors: how bad the bad cases are
                              # worst     the single largest error
                              # combined  mean + penalty x (cvar - mean): average, plus a charge for bad cases
                              # Each is computed at every horizon and averaged over 1..horizon.
  tail_share: 0.10            # the "worst 10%" used by cvar and combined
  penalty: 0.5                # combined: 0 = plain average, 1 = tail only
  compare_against: [random_walk, ar1]    # benchmarks shown as "vs ..." columns; any method can be one,
                                         # e.g. [class] or ["bma (rate x balance)"]

horizon: 12                   # quarters ahead (errors are averaged over 1..12)

oos:                          # rolling-origin, out-of-sample test: every method re-estimated at each origin
  start: 2012Q4               # first origin
  step: 1                     # every quarter
  # Forecasts in the test use the macro values that actually happened (a conditional forecast, the usual
  # way to validate stress-test models).

intervals:
  levels: [0.80, 0.95]        # conformal bands from the out-of-sample errors at each horizon
  min_calibration: 12         # errors needed before a band is computed in the honest coverage check

methods:
  run: [bma, combination, class, ar1, drift, random_walk]   # which methods to estimate (benchmarks named in
                                                            # ranking.compare_against are always added)
  bma:                        # IMF Global Solvency Stress Test: panel fixed effects, BMA, sign constraints
    max_vars: 3               # models with 0..3 macro drivers (all subsets of the screened drivers)
  combination:                # Guerrieri & Welch (2012): one regression per macro variable, lags 1..4, averaged
    lags: 4
    n_vars: 10                # the strongest 10 drivers by screening (signs not imposed, as in the paper)
  class:                      # NY Fed CLASS: one small, fixed, economically motivated equation per target
    enabled: true             # the drivers are set per target (class_drivers). In this example every balance
                              # uses the same generic set (GDP, unemployment, house prices, short rate) and every
                              # rate the same market rates, so the challenger is not tuned to the data.

targets:
  # --- one bank ----------------------------------------------------------------------------------------
  - name: loans_single
    label: Loans, one bank
    file: data/bank_data.csv
    column: loan_balance
    events: data/bank_events.csv          # acquisitions are taken out of growth (organic change)
    form: dlog
    signs: data/macro_metadata.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  - name: deposits_single
    label: Deposits, one bank
    file: data/bank_data.csv
    column: deposit_balance
    events: data/bank_events.csv
    form: dlog
    signs: data/macro_metadata_deposits.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  # --- a panel of banks --------------------------------------------------------------------------------
  - name: loans_panel
    label: Loans, five banks
    file: data/panel_bank_data.csv
    column: loan_balance
    bank_column: bank_name
    events: data/panel_bank_events.csv
    form: dlog
    signs: data/macro_metadata.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]
    # Settings for this target only (they override the global ones above), for example:
    # estimation: {mode: separate, banks: [Bank A, Bank B]}
    # restrictions: {force_in: [FHPI.ION@1], not_together: [[FYPD.ION, FYPD.IC]]}
    # ranking: {metric: cvar, compare_against: [class]}

  - name: mortgage_balance
    label: Mortgage balances, five banks
    file: data/panel_system_data.csv
    column: mortgage_balance
    bank_column: bank_name
    form: dlog
    signs: data/macro_metadata.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  - name: commercial_balance
    label: Commercial loan balances, five banks
    file: data/panel_system_data.csv
    column: commercial_balance
    bank_column: bank_name
    form: dlog
    signs: data/macro_metadata_commercial_loans.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  - name: total_loans
    label: Total loans (mortgages + commercial), five banks
    file: data/panel_system_data.csv
    bank_column: bank_name
    expression: mortgage_balance + commercial_balance
    form: dlog
    signs: data/macro_metadata.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  - name: deposit_balance
    label: Deposit balances, five banks
    file: data/panel_system_data.csv
    column: deposit_balance
    bank_column: bank_name
    form: dlog
    signs: data/macro_metadata_deposits.csv
    units: $ millions
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]

  - name: mortgage_rate
    label: Mortgage rate, five banks
    file: data/panel_system_data.csv
    column: mortgage_rate
    bank_column: bank_name
    form: diff
    signs: data/macro_metadata_deposit_rate.csv     # rates move with market rates (+)
    units: percentage points
    class_drivers: [FRTB3M.IC@0, FRGOV5Y.IC@0]

  - name: deposit_rate
    label: Deposit rate, five banks
    file: data/panel_system_data.csv
    column: deposit_rate
    bank_column: bank_name
    form: diff
    signs: data/macro_metadata_deposit_rate.csv
    units: percentage points
    class_drivers: [FRTB3M.IC@0, FRGOV5Y.IC@0]

  # --- Fed approach: income = rate x balance -------------------------------------------------------------
  # Net interest income (simplified: mortgage interest minus deposit interest, per quarter). Forecast two ways:
  #   direct            each method forecasts NII dollars itself
  #   rate x balance    each method forecasts the four parts above; NII is rebuilt from them
  - name: nii
    label: Net interest income (mortgages less deposits), five banks
    file: data/panel_system_data.csv
    bank_column: bank_name
    expression: (mortgage_rate * mortgage_balance - deposit_rate * deposit_balance) / 400
    form: dlog
    signs: data/macro_metadata.csv
    units: $ millions a quarter
    class_drivers: [FGDPR.ION@0, FLBR.ION@0, FHPI.ION@1, FRTB3M.IC@1]
    rate_x_balance:            # the same expression over forecast parts
      parts: [mortgage_rate, mortgage_balance, deposit_rate, deposit_balance]
